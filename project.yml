name: Wimm
options:
  bundleIdPrefix: com.wimm
packages:
  WimmPackage:
    path: .
  WimmCore:
    path: Packages/WimmCore
targets:
  WimmiOSApp:
    type: application
    platform: iOS
    productType: com.apple.product-type.application
    deploymentTarget: "17.0"
    sources:
      # Исключаем Info.plist из источников файлов, так как он задается явно в настройках INFOPLIST_FILE
      - path: Sources/WimmiOS
        excludes:
          - Info.plist 
      - path: Sources/WimmiOSShared
        excludes:
          - "Resources/**"
      - path: Sources/WimmiOSShared/Resources
        buildPhase: resources
    settings:
      INFOPLIST_FILE: Sources/WimmiOS/Info.plist
      CODE_SIGN_ENTITLEMENTS: Sources/WimmiOS/WimmiOSApp.entitlements
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      PRODUCT_BUNDLE_IDENTIFIER: com.micha.wimm
      MARKETING_VERSION: 1.8.1
      CURRENT_PROJECT_VERSION: 1
      TARGETED_DEVICE_FAMILY: 1,2 # iPhone/iPad
      DEVELOPMENT_TEAM: 32KX9D23R9
      CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: WimmPackage
        product: WimmTranscription
      - package: WimmCore
        product: WimmDomain
      - package: WimmCore
        product: WimmInfrastructure
      - target: WimmShareExtension
        embed: true
  WimmiOSTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/WimmiOSTests
    settings:
      GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: WimmiOSApp
  WimmShareExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/WimmShareExtension
        excludes:
          - Info.plist
    settings:
      INFOPLIST_FILE: Sources/WimmShareExtension/Info.plist
      CODE_SIGN_ENTITLEMENTS: Sources/WimmShareExtension/WimmShareExtension.entitlements
      PRODUCT_BUNDLE_IDENTIFIER: com.micha.wimm.ShareExtension
      MARKETING_VERSION: 1.8.1
      CURRENT_PROJECT_VERSION: 1
      TARGETED_DEVICE_FAMILY: 1,2
      DEVELOPMENT_TEAM: 32KX9D23R9
      CODE_SIGN_STYLE: Automatic
      SKIP_INSTALL: true
schemes:
  WimmiOSApp:
    build:
      targets:
        WimmiOSApp: all
    test:
      targets:
        - WimmiOSTests
    run:
      config: Debug
